<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ask</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #cb70cf, #be5050);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    text-align: center;
    color: white;
    z-index: 2;
  }

  h1 {
    font-size: 2.5rem;
    animation: fadeIn 2s ease-in-out;
  }

  .buttons {
    margin-top: 30px;
    position: relative;
    width: 300px;
    height: 200px;
  }

  button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    position: absolute;
    transition: all 0.3s ease;
    touch-action: manipulation;
  }

  #yesBtn {
    background: #00c853;
    left: 20%;
    color: white;
  }

  #yesBtn:hover {
    transform: scale(1.2);
    box-shadow: 0 0 20px #00ff88;
  }

  #noBtn {
    background: #d50000;
    left: 60%;
    color: white;
  }

  .heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(0.5);
      opacity: 0;
    }
    50% {
      opacity: 1;
    }
    100% {
      transform: translateY(-10vh) scale(1.2);
      opacity: 0;
    }
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }
</style>
</head>

<body>

<div class="container">
  <h1>will you go out with me?</h1>

  <div class="buttons">
    <button id="yesBtn">Yes </button>
    <button id="noBtn">No </button>
  </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  let noTexts = [
    "No 😒",
    "Are you sure? ",
    "Think again ",
    "Really? ",
    "Last chance ",
    "chal le na  "
    
  ];
  let index = 0;

  function moveNo() {
    const container = document.querySelector(".buttons");

    const maxX = container.clientWidth - noBtn.offsetWidth;
    const maxY = container.clientHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    if (index < noTexts.length - 1) {
      index++;
      noBtn.innerText = noTexts[index];
    }

    
    yesBtn.style.transform = `scale(${1 + index * 0.1})`;
  }

  
  noBtn.addEventListener("mouseenter", moveNo);

  noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNo();
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;background:linear-gradient(135deg,#ff9a9e);color:#fff;">
        <h1 style="font-size:3rem;">YEEEEEEEE😌😌</h1>
       
      </div>
    `;
    createHearts(60);
  });

  function createHearts(num) {
    for (let i = 0; i < num; i++) {
      let heart = document.createElement("div");
      heart.innerHTML = "😶‍🌫️";
      heart.classList.add("heart");

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";

      document.body.appendChild(heart);
    }
  }

  setInterval(() => {
    createHearts(4);
  }, 800);
</script>

</body>
</html>
